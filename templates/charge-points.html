<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>포인트 충전</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      margin: 5rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #00a04e;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1rem;
    }
    input[type="number"], input[type="password"], button {
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
    }
    input[type="number"], input[type="password"] {
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      padding: 0.8rem;
      background-color: #00a04e;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 3rem;
    }
    button:hover {
      background-color: #008c4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>포인트 충전</h2>
    <form onsubmit="return validateForm(event)">
      <label for="amount">충전할 포인트</label>
      <div class="form-group">
        <input type="number" id="amount" name="amount" placeholder="예: 1000" min="1" required>

        <label for="password">비밀번호 확인</label>
        <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>

        <button type="submit">충전하기</button>
      </div>
    </form>
  </div>

  <script>
    async function validateForm(event) {
      event.preventDefault();  

      const amount = document.getElementById("amount").value;
      const password = document.getElementById("password").value;

      if (!amount || amount <= 0) {
        alert("충전할 포인트를 입력해주세요.");
        return;
      }

      if (!password || password.length < 4) {
        alert("비밀번호를 입력해주세요. (최소 4자리 이상)");
        return;
      }

      try {
        const response = await fetch('/points/deposit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            amount: amount,
            password: password,
          }),
        });

        const data = await response.json();
        if (response.ok) {
          alert('충전 요청이 완료되었습니다.');
          window.location.href = "/mypage";  
        } else {
          alert(data.message || '오류가 발생했습니다.');
        }
      } catch (err) {
        alert('서버 오류로 충전할 수 없습니다.');
      }
    }
  </script>
</body>
</html>
