<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>소개글 수정</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      margin: 5rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #00a04e;
    }
    label {
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-family: inherit;
      font-size: 1rem;
      resize: vertical;
    }
    button {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.8rem;
      background-color: #00a04e;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #008c4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>소개글 수정</h2>
    <form>
      <label for="intro">소개글</label>
      <textarea id="intro" name="intro">안녕하세요! 저는 친환경 중고거래를 실천하고 있는 사용자입니다.</textarea>
      <button type="submit">저장</button>
    </form>
  </div>
</body>
</html>
