<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 변경</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      margin: 5rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #00a04e;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 2rem;
      width: 100%;
      padding: 0.8rem;
      background-color: #00a04e;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #008c4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>비밀번호 변경</h2>
    <form>
      <label for="current">현재 비밀번호</label>
      <input type="password" id="current" name="current">

      <label for="new">새 비밀번호</label>
      <input type="password" id="new" name="new">

      <label for="confirm">새 비밀번호 확인</label>
      <input type="password" id="confirm" name="confirm">

      <button type="submit">비밀번호 변경</button>
    </form>
  </div>
</body>
</html>
