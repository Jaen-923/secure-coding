<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>비밀번호 변경</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 500px;
      margin: 5rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #00a04e;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box; /* 입력폼 너비 계산 시 padding과 border를 포함시킴 */
    }
    button {
      margin-top: 5rem;
      width: 100%;
      padding: 0.8rem;
      background-color: #00a04e;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      box-sizing: border-box; /* 버튼 너비 계산 시 padding과 border를 포함시킴 */
    }
    button:hover {
      background-color: #008c4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>비밀번호 변경</h2>
    <form id="passwordChangeForm">
      <label for="current">현재 비밀번호</label>
      <input type="password" id="current" name="current" required>

      <label for="new">새 비밀번호</label>
      <input type="password" id="new" name="new" required>

      <label for="confirm">새 비밀번호 확인</label>
      <input type="password" id="confirm" name="confirm" required>

      <button type="submit">비밀번호 변경</button>
    </form>
  </div>

  <script>
    document.getElementById('passwordChangeForm').addEventListener('submit', async function(event) {
      event.preventDefault();

      const currentPassword = document.getElementById('current').value;
      const newPassword = document.getElementById('new').value;
      const confirmPassword = document.getElementById('confirm').value;

      // 새 비밀번호와 확인 비밀번호가 일치하는지 확인
      if (newPassword !== confirmPassword) {
        alert('새 비밀번호와 비밀번호 확인이 일치하지 않습니다.');
        return;
      }

      // 비밀번호 변경 API 호출
      try {
        const response = await fetch('/auth/pwchange', {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            current_password: currentPassword,
            new_password: newPassword
          })
        });

        const data = await response.json();

        if (response.ok) {
          alert('비밀번호가 변경되었습니다.');
          window.location.href = '/mypage'; // 마이페이지로 리다이렉션
        } else {
          alert(data.message || '비밀번호 변경에 실패했습니다.');
        }
      } catch (error) {
        alert('비밀번호 변경 중 오류가 발생했습니다.');
      }
    });
  </script>
</body>
</html>
