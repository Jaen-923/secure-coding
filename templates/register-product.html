<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 등록</title>
  <style>
    body {
      font-family: "Pretendard", sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 2rem;
    }
    .container {
      max-width: 600px;
      margin: 5rem auto;
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    h2 {
      text-align: center;
      color: #00a04e;
    }
    label {
      display: block;
      margin-top: 1.2rem;
      font-weight: bold;
    }
    input[type="text"], input[type="number"], textarea {
      width: 100%;
      padding: 0.75rem;
      margin-top: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    button {
      margin-top: 2rem;
      width: 100%;
      padding: 0.8rem;
      background-color: #00a04e;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background-color: #008c4a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>상품 등록</h2>
    <form id="productForm">
      <label for="title">상품 제목</label>
      <input type="text" id="title" name="title" placeholder="예: 에코백" required>

      <label for="description">상품 설명</label>
      <textarea id="description" name="description" placeholder="상품에 대한 설명을 입력해주세요" required></textarea>

      <label for="price">가격 (원)</label>
      <input type="number" id="price" name="price" placeholder="예: 10000" min="1" required>

      <button type="submit">등록하기</button>
    </form>
  </div>

  <script>
    async function validateProductForm(event) {
      event.preventDefault();

      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const price = document.getElementById("price").value;

      if (!title || !description || !price || price <= 0) {
        alert("모든 항목을 올바르게 입력해주세요.");
        return false;
      }

      const payload = {
        title,
        description,
        price
      };

      try {
        const response = await fetch("/product/new", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (response.ok) {
          alert(result.message);
          window.location.href = "/home";
        } else {
          alert(result.message);
        }
      } catch (error) {
        console.error(error);
        alert("서버 오류가 발생했습니다.");
      }

      return false;
    }

    document.getElementById("productForm").addEventListener("submit", validateProductForm);
  </script>
</body>
</html>
